<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  a:focus-visible { outline: 2px solid #B85C3D; outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.001ms !important; animation: none !important; }
  }

  :root {
    --bg: #1A1A1A;
    --bg-2: #242424;
    --amber: #E8A050;
    --amber-dark: #C9863C;
    --white: #FFFFFF;
    --muted: rgba(255,255,255,0.62);
    --muted-soft: rgba(255,255,255,0.42);
    --line: rgba(255,255,255,0.10);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(232,160,80,0.3); }

  /* Open-in banner */
  .open-banner {
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .open-banner .ob-mark {
    width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(140deg, var(--amber), var(--amber-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(232,160,80,0.3);
  }
  .open-banner .ob-text { flex: 1; min-width: 0; }
  .open-banner .ob-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .open-banner .ob-sub { font-size: 11.5px; color: var(--muted-soft); }
  .ob-btn {
    flex-shrink: 0;
    background: var(--amber);
    color: var(--bg);
    font-size: 13px; font-weight: 700;
    padding: 9px 18px; border-radius: 999px;
    letter-spacing: -0.005em;
  }

  /* Layout */
  .wrap {
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 26px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 56px;
  }
  .logo-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(140deg, var(--amber), var(--amber-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(232,160,80,0.32), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .logo-word {
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  }

  h1 {
    font-size: clamp(40px, 12vw, 56px);
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.035em;
    margin-bottom: 20px;
  }
  h1 em { font-style: normal; color: var(--amber); }

  .sub {
    font-size: 17px;
    color: var(--muted);
    line-height: 1.55;
    max-width: 360px;
    margin: 0 auto 44px;
    letter-spacing: -0.005em;
  }

  /* Buttons */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 13px;
    width: 100%;
    max-width: 340px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 9px; width: 100%;
    padding: 16px 22px;
    border-radius: 14px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; border: none;
    transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.2s ease;
    letter-spacing: -0.01em;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-amber {
    background: linear-gradient(135deg, var(--amber), var(--amber-dark));
    color: var(--bg);
    box-shadow: 0 6px 20px rgba(232,160,80,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-amber:hover { box-shadow: 0 10px 28px rgba(232,160,80,0.36), inset 0 1px 0 rgba(255,255,255,0.24); }
  .btn-store {
    background: var(--bg-2);
    color: var(--white);
    border: 1px solid var(--line);
  }
  .btn-store:hover { background: #2e2e2e; }
  .btn-store .store-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
  .btn-store .store-small { font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
  .btn-store .store-big { font-size: 17px; font-weight: 700; }

  .footnote {
    margin-top: 36px;
    font-size: 13px;
    color: var(--muted-soft);
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 11.5px;
    color: var(--muted-soft);
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--muted); }
</style>
</head>
