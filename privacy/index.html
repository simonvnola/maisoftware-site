<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mai Software — Privacy Policies</title>
<meta name="description" content="Privacy policies for each of our apps.">
<link rel="icon" href="/maisoftware-site/favicon.ico">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f1118; --ink-soft: #5a5f72; --ink-muted: #9aa0b8;
    --purple: #667eea; --purple-light: #eef0ff;
    --border: rgba(102,126,234,0.12); --bg: #fafbff;
  }
  body {
    font-family: 'Fraunces', Georgia, serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 24px; -webkit-font-smoothing: antialiased;
  }
  .wordmark {
    font-size: 42px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 28px; line-height: 1;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #8b9fef 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 1px 0 rgba(102,126,234,0.04);
  }
  @media (max-width: 520px) { .wordmark { font-size: 32px; letter-spacing: 0.06em; } }
  .intro { max-width: 520px; text-align: center; margin-bottom: 48px; font-weight: 300; color: var(--ink-soft); font-size: 17px; line-height: 1.55; letter-spacing: -0.005em; }
  .intro em { font-style: italic; color: var(--ink); }
  .apps { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; }
  .app-link {
    display: flex; align-items: center; gap: 16px; padding: 18px 20px;
    background: white; border: 1px solid var(--border); border-radius: 18px;
    text-decoration: none; color: var(--ink);
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .app-link:hover { box-shadow: 0 6px 24px rgba(102,126,234,0.12); transform: translateY(-1px); }
  .app-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(140deg, #8b9fef, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 4px 12px rgba(102,126,234,0.3);
  }
  .app-icon img {
    width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit;
  }
  .app-name { font-size: 17px; font-weight: 300; letter-spacing: -0.01em; margin-bottom: 2px; }
  .app-desc { font-size: 12px; color: var(--ink-muted); font-weight: 300; }
  .app-arrow { margin-left: auto; color: var(--ink-muted); flex-shrink: 0; }
  footer { margin-top: 56px; font-size: 11px; color: var(--ink-muted); font-weight: 300; letter-spacing: 0.05em; }
  body, html, h1, h2, h3, h4, h5, h6, p, a, button, input, select, textarea, label, span, div, li, td, th, strong, em {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
  }
</style>
</head>
