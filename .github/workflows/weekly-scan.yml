name: Weekly Regulatory Intelligence Scan

# Fallback scheduler for /api/run-scan, for use when Vercel Cron is not
# available (e.g. the Hobby plan). Configure two repo secrets:
#   SCAN_URL     e.g. https://maisoftware.app/api/run-scan
#   CRON_SECRET  must match the CRON_SECRET env var set in Vercel
#
# If you rely on Vercel Cron instead, you can disable this workflow.

on:
  schedule:
    # Mondays at 06:10 UTC (just after the Vercel cron slot).
    - cron: '10 6 * * 1'
  workflow_dispatch: {}

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the scan endpoint
        run: |
          if [ -z "${{ secrets.SCAN_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "SCAN_URL and CRON_SECRET repo secrets must be set." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/scan_out.json -w "%{http_code}" \
            --max-time 600 \
            -X POST "${{ secrets.SCAN_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/scan_out.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "Scan trigger failed (HTTP $code)." >&2
            exit 1
          fi
